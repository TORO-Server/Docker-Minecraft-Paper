name: Mirror legacy image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to copy from ghcr.io/malken21/docker-minecraft-paper
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Copy the tag from the old owner
        env:
          TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/toro-server/docker-minecraft-paper:${TAG}" \
            "ghcr.io/malken21/docker-minecraft-paper:${TAG}"