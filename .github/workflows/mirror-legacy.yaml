name: Mirror legacy image
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Copy 1.20.4-3 from the old owner
        run: |
          docker buildx imagetools create \
            -t ghcr.io/toro-server/docker-minecraft-paper:1.20.4-3 \
            ghcr.io/malken21/docker-minecraft-paper:1.20.4-3